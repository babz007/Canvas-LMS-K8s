# to use this add docker-compose/mailcatcher.override.yml
# to your COMPOSE_FILE var in .env

version: '2.3'
services:
  web:
    links:
      - mailcatcher

  mailcatcher:
    image: instructure/mailcatcher
    environment:
      VIRTUAL_HOST: mail.canvas.endeavour.cs.vt.edu
      VIRTUAL_PORT: 8080
